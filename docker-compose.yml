services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: worknoon
      DB_USERNAME: worknoon
      DB_PASSWORD: ${DB_PASSWORD:-worknoon-local}
      GERMINI_API_KEY: ${GERMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: worknoon
      POSTGRES_USER: worknoon
      POSTGRES_PASSWORD: ${DB_PASSWORD:-worknoon-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worknoon -d worknoon"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
